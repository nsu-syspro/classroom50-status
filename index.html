<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSU Sys.Pro</title>
<style>
  :root {
    --bg: #ffffff; --fg: #24292f; --muted: #57606a; --line: #d0d7de;
    --ok: #1a7f37; --ok-bg: #dafbe1; --warn: #9a6700; --warn-bg: #fff8c5;
    --bad: #cf222e; --bad-bg: #ffebe9; --na: #d0d7de;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* center everything on wide screens; the content column is capped and
     floats in the middle, so no one-sided empty space */
  #app { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  .meta { color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
  .legend { margin: 0 0 1rem; font-size: .85rem; color: var(--muted); }
  /* direct children only: a descendant selector would also hit the inner
     .split-text span of the legend demo badge and skew its split (extra
     padding + margin made the blue half visibly wider). The .squares
     override is needed because this rule (0,1,1) beats .squares (0,1,0):
     flattened to inline-block, the demo grid's empty <i> squares collapse
     to 0x0 and vanish. */
  .legend > span { display: inline-block; padding: 0 .5em; margin-right: .75em; border-radius: 3px; }
  .legend > span.squares { display: inline-flex; padding: 0; margin-right: 0; border-radius: 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid var(--line); padding: .35rem .6rem; text-align: left; }
  th { background: #f6f8fa; font-weight: 600; }
  th .due { display: block; font-weight: 400; font-size: .75rem; color: var(--muted); }
  td.student { white-space: nowrap; }
  a { color: #0969da; text-decoration: none; }
  a:hover { text-decoration: underline; }
  /* score · squares: the dot is the fixed center of the column, the score
     is right-aligned to its left and the per-task squares left-aligned to
     its right, so all dots line up vertically regardless of text lengths.
     minmax(0, 1fr), NOT plain 1fr: a bare 1fr track has an auto minimum, so
     when the column is squeezed to its widest cell ("10/10" rows) a cell
     with a narrower score ("0/6") gets leftover free space split across
     both side tracks, which pushed its dot off the column center. */
  .cell { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: .3rem; }
  .cell .score { text-align: right; white-space: nowrap; }
  .cell .dot { color: #8c959f; padding: 0 .1em; }
  .cell .status { text-align: left; }
  .badge { display: inline-block; padding: .05rem .45rem; border-radius: 3px; font-size: .78rem; }
  .approved { background: var(--ok-bg); color: var(--ok); }
  .changes_requested { background: var(--bad-bg); color: var(--bad); }
  .unreviewed { background: var(--warn-bg); color: var(--warn); }
  /* per-task grid: one square per point-bearing task, green = accepted,
     red = the review rejected the task (на доработку), yellow = submitted
     and awaiting review (first submission or a resubmission after a
     changes-requested review - no special border), gray = auto-tests do
     not pass. */
  .squares { display: inline-flex; gap: 2px; vertical-align: middle; }
  .squares i { width: 9px; height: 9px; border-radius: 2px; }
  .squares .accepted { background: var(--ok); }
  .squares .rejected { background: var(--bad); }
  .squares .pending  { background: #d4a72c; }
  .squares .failed   { background: #eaeef2; box-shadow: inset 0 0 0 1px var(--line); }
  .closed, .no_pr, .unknown, .none { background: #f6f8fa; color: var(--muted); }
  .missing { color: var(--na); text-align: center; }
  /* зачет column: green badge only when EVERY past-due assignment has at
     least 8 accepted points; otherwise red; dash when nothing submitted */
  .zachet { text-align: center; white-space: nowrap; }
  footer { margin-top: 1.5rem; color: var(--muted); font-size: .8rem; }
  .error { color: var(--bad); }
  /* classroom list view */
  ul.classrooms { list-style: none; padding: 0; max-width: 480px; }
  ul.classrooms li { border: 1px solid var(--line); border-radius: 6px; margin-bottom: .5rem; }
  ul.classrooms a { display: block; padding: .6rem .9rem; font-size: 1.05rem; }
  ul.classrooms .sub { display: block; font-size: .8rem; color: var(--muted); }
  .back { font-size: .85rem; margin-bottom: .75rem; display: inline-block; }
  footer a.failed { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const LEGEND_RU = {
  approved: "проверено",
  changes_requested: "есть замечания",
  changes_requested_seen: "на проверке",
  unreviewed: "на проверке",
  closed: "PR закрыт",
  no_pr: "нет PR",
  unknown: "?",
  none: ""
};

const app = document.getElementById("app");

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

/* demo square for the legend: a one-square .squares grid of the given kind */
function squareDemo(kind) {
  const span = el("span", "squares");
  span.append(el("i", kind));
  return span;
}

/* Per-task square vocabulary (what generate_progress.py emits in cell.tasks
   and what each square means) plus the legacy pre-backfill names. */
const SQUARE_CLASS = {
  accepted: "accepted", rejected: "rejected", pending: "pending", failed: "failed",
  scored: "pending", unscored: "failed",
};
const SQUARE_TITLE = {
  accepted: "Зачтено",
  rejected: "На доработку",
  pending: "Сдано, ожидает проверки",
  failed: "Автотесты не проходят",
};

function fmtDate(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" });
}

async function getJson(url) {
  const resp = await fetch(url, { cache: "no-store" });
  if (!resp.ok) throw new Error("HTTP " + resp.status + " for " + url);
  return resp.json();
}

/* ---- classroom list view ---- */
async function renderIndex() {
  app.replaceChildren();
  document.title = "NSU Sys.Pro";
  app.append(el("h1", null, "NSU Sys.Pro"));

  let index;
  try {
    index = await getJson("classrooms.json");
  } catch (err) {
    app.append(el("p", "error", "Не удалось загрузить список курсов: " + err.message));
    return;
  }

  const classrooms = index.classrooms || [];
  if (!classrooms.length) {
    app.append(el("p", "meta", "Пока нет опубликованных курсов."));
    return;
  }
  const lastRun = await getLastRun();
  const runTime = lastRun && lastRun.created_at ? new Date(lastRun.created_at) : null;
  const list = el("ul", "classrooms");
  for (const c of classrooms) {
    const li = el("li");
    const a = el("a", null, c.title || c.slug);
    a.href = "?classroom=" + encodeURIComponent(c.slug);
    const sub = el("span", "sub", null);
    // Same timestamp the classroom pages show in their footer: the last
    // publish run, fetched live (fall back to generation time if the API
    // call fails).
    const when = runTime || (c.generated_at ? new Date(c.generated_at) : null);
    sub.textContent = "обновлено: " + (when ? when.toLocaleString("ru-RU") : "?");
    a.append(sub);
    li.append(a);
    list.append(li);
  }
  app.append(list);
}

/* ---- publish-run status, fetched live from the public Actions API ---- */
const RUNS_URL = "https://github.com/nsu-syspro/classroom50-status/actions/workflows/publish-progress.yaml";
const RUN_API = "https://api.github.com/repos/nsu-syspro/classroom50-status/actions/workflows/publish-progress.yaml/runs?per_page=1";

async function getLastRun() {
  try {
    const resp = await fetch(RUN_API, { headers: { "Accept": "application/vnd.github+json" } });
    if (!resp.ok) return null;
    const runs = (await resp.json()).workflow_runs || [];
    return runs[0] ? { conclusion: runs[0].conclusion, created_at: runs[0].run_started_at } : null;
  } catch {
    return null;
  }
}

/* ---- single classroom view ---- */

async function renderClassroom(slug) {
  app.replaceChildren();

  let data;
  try {
    data = await getJson(slug + "/data/progress.json");
  } catch (err) {
    const fallbackTitle = slug + " · NSU Sys.Pro";
    document.title = fallbackTitle;
    app.append(el("h1", null, fallbackTitle));
    app.append(el("p", "error", "Не удалось загрузить данные: " + err.message));
    const back = el("a", "back", "← все курсы");
    back.href = "?";
    app.append(back);
    return;
  }

  const back = el("a", "back", "← все курсы");
  back.href = "?";
  app.append(back);
  const title = (data.classroom_title || data.classroom) + " · NSU Sys.Pro";
  document.title = title;
  app.append(el("h1", null, title));
  const legend = el("p", "legend");
  legend.append("Ячейка: зачтено / баллов автотеста. Квадраты: ");
  legend.append(squareDemo("accepted"), " зачтено · ");
  legend.append(squareDemo("rejected"), " на доработку · ");
  legend.append(squareDemo("pending"), " сдано, ожидает проверки · ");
  legend.append(squareDemo("failed"), " автотесты не проходят. ");
  legend.append(el("br"));
  legend.append("Зачет: все работы сданы не ниже чем на 8 принятых баллов. ");
  legend.append("Ссылка в ячейке ведёт на ваш pull request с решением.");
  app.append(legend);

  const table = el("table");
  const thead = el("thead");
  const tbody = el("tbody");

  const headRow = el("tr");
  headRow.append(el("th", null, "Студент"));
  headRow.append(el("th", null, "Зачет"));
  for (const a of data.assignments) {
    const th = el("th", null, a.name || a.slug);
    th.append(el("span", "due", "до " + fmtDate(a.due)));
    headRow.append(th);
  }
  thead.append(headRow);

  const cells = new Map();
  for (const c of data.cells) cells.set(c.student + "|" + c.assignment, c);

  for (const s of data.students) {
    const tr = el("tr");
    tr.append(el("td", "student", s.display));
    const ztd = el("td", "zachet");
    if (s.zachet === "pass") {
      ztd.append(el("span", "badge approved", "зачет"));
    } else if (s.zachet === "fail") {
      ztd.append(el("span", "badge changes_requested", "незачет"));
    } else {
      ztd.className = "zachet missing";
      ztd.textContent = "—";
    }
    tr.append(ztd);
    for (const a of data.assignments) {
      const c = cells.get(s.username + "|" + a.slug);
      const td = el("td");
      if (!c) { td.className = "missing"; td.textContent = "—"; tr.append(td); continue; }
      const wrap = el("div", "cell");
      const got = c.score != null ? c.score : 0;
      const accepted = c.accepted_score != null ? c.accepted_score : got;
      const score = el("span", "score");
      if (c.pr_url) {
        const link = el("a", null, accepted + "/" + got);
        link.href = c.pr_url;
        score.append(link);
      } else {
        score.textContent = accepted + "/" + got;
      }
      wrap.append(score, el("span", "dot", "·"));
      const status = el("span", "status");
      const review = (c.review === "changes_requested" && c.fix_submitted)
        ? "changes_requested_seen" : c.review;
      if (Array.isArray(c.tasks) && c.tasks.length) {
        // per-task squares; each square carries its own tooltip, the grid
        // keeps the review-state wording. Pre-backfill data used the legacy
        // state names scored/unscored - normalize them to the current ones.
        const squares = el("span", "squares");
        squares.title = LEGEND_RU[review] || review;
        for (const st of c.tasks) {
          const cls = SQUARE_CLASS[st] || st;
          const sq = el("i", cls);
          sq.title = SQUARE_TITLE[cls] || cls;
          squares.append(sq);
        }
        status.append(squares);
      } else {
        // legacy data without per-task states: fall back to the text badge
        status.append(el("span", "badge " + review, LEGEND_RU[review] || review));
      }
      wrap.append(status);
      td.append(wrap);
      tr.append(td);
    }
    tbody.append(tr);
  }
  table.append(thead, tbody);
  app.append(table);

  // footer: last refresh date + failure indicator, fetched LIVE from the
  // public Actions API (no commit needed for timestamps)
  const lastRun = await getLastRun();

  const footer = el("footer");
  const failed = lastRun && lastRun.conclusion !== "success";
  const when = lastRun && lastRun.created_at
    ? new Date(lastRun.created_at)
    : (data.generated_at ? new Date(data.generated_at) : null);
  footer.append("Обновлено: ");
  if (when) {
    const link = el("a", failed ? "failed" : null,
      when.toLocaleString("ru-RU"));
    link.href = RUNS_URL;
    link.target = "_blank";
    link.rel = "noopener";
    footer.append(link);
  }
  if (failed) {
    const warn = el("a", "failed", " · обновление с ошибкой, журнал запусков");
    warn.href = RUNS_URL;
    warn.target = "_blank";
    warn.rel = "noopener";
    footer.append(warn);
  }
  app.append(footer);
}

const slug = new URLSearchParams(location.search).get("classroom");
(slug ? renderClassroom(slug) : renderIndex()).catch(err => {
  app.replaceChildren(el("p", "error", "Ошибка: " + err.message));
});
</script>
</body>
</html>
